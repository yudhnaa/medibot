---
name: Backend Staging Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy to staging
        required: true
        default: develop
      smoke_url:
        description: Staging base URL for the post-deploy smoke check
        required: true
        default: https://medibot-api-staging.yudhna.id.vn

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      image-tag: ${{ steps.version.outputs.image-tag }}
    steps:
      - name: Validate staging ref
        run: |
          if [ "${{ inputs.ref }}" != "develop" ]; then
            echo "Staging deployments are restricted to the develop branch."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve image name
        id: image
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve image tag
        id: version
        run: |
          echo "image-tag=staging-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            REQUIREMENTS_FILE=requirements/base.txt
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.version.outputs.image-tag }}
            ${{ steps.image.outputs.image }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: Staging
      url: ${{ inputs.smoke_url }}
    steps:
      - name: Deploy to staging DigitalOcean
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_TOKEN: ${{ secrets.STAGING_GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.STAGING_GHCR_USERNAME }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          MEDIBOT_BACKEND_IMAGE: ${{ needs.build.outputs.image }}
          STAGING_APP_DIR: ${{ vars.STAGING_DO_APP_DIR }}
          STAGING_URL: ${{ inputs.smoke_url }}
          AWS_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.STAGING_R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.STAGING_R2_BUCKET || vars.R2_BUCKET }}
          R2_LIBS_PREFIX: ${{ vars.STAGING_R2_LIBS_PREFIX || vars.R2_LIBS_PREFIX || 'libs' }}
        with:
          host: ${{ vars.STAGING_DO_HOST }}
          username: ${{ vars.STAGING_DO_USER }}
          key: ${{ secrets.STAGING_DO_SSH_KEY }}
          port: ${{ vars.STAGING_DO_SSH_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_USERNAME,IMAGE_TAG,MEDIBOT_BACKEND_IMAGE,STAGING_APP_DIR,STAGING_URL,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,R2_ACCOUNT_ID,R2_BUCKET,R2_LIBS_PREFIX
          script: |
            set -eu

            cd "${STAGING_APP_DIR:-/opt/medibot-staging/backend}"

            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_USERNAME:-${USER}}" --password-stdin
            fi

            export IMAGE_TAG
            export MEDIBOT_BACKEND_IMAGE

            ./scripts/sync-r2-libs.sh

            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d medibot-db medibot-redis
            docker compose -f docker-compose.yml run --rm \
              -e RUN_DB_MIGRATIONS=true \
              -e RUN_COLLECTSTATIC=true \
              medibot-web ./docker-entrypoint.sh true
            docker compose -f docker-compose.yml up -d --remove-orphans
            docker compose -f docker-compose.yml ps

            # Wait for app to be ready with retry logic
            echo "Waiting for app to be ready at ${STAGING_URL}..."
            echo "Initial startup delay: 10 seconds..."
            sleep 10

            for i in {1..30}; do
              if curl -fsS "${STAGING_URL}/swagger.json" >/dev/null 2>&1; then
                echo "Smoke test passed! App is ready."
                exit 0
              fi
              echo "Attempt $i/30: Waiting 5s for app to be ready..."
              sleep 5
            done

            echo "App failed to respond after startup + 150 seconds"
            docker compose -f docker-compose.yml logs medibot-web | tail -50
            exit 1
