---
name: Backend Deploy

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed

permissions:
  contents: read
  packages: write

env:
  PRODUCTION_URL: https://medibot-api.yudhna.id.vn

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      image-tag: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve image name
        id: image
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            REQUIREMENTS_FILE=requirements/base.txt
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.event.workflow_run.head_sha }}
            ${{ steps.image.outputs.image }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ env.PRODUCTION_URL }}
    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.2.2
        env:
          DO_APP_DIR: ${{ vars.DO_APP_DIR }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          MEDIBOT_BACKEND_IMAGE: ${{ needs.build.outputs.image }}
          PRODUCTION_URL: ${{ env.PRODUCTION_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_LIBS_PREFIX: ${{ vars.R2_LIBS_PREFIX || 'libs' }}
        with:
          host: ${{ vars.DO_HOST }}
          username: ${{ vars.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ vars.DO_SSH_PORT || 22 }}
          envs: DO_APP_DIR,GHCR_TOKEN,GHCR_USERNAME,IMAGE_TAG,MEDIBOT_BACKEND_IMAGE,PRODUCTION_URL,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,R2_ACCOUNT_ID,R2_BUCKET,R2_LIBS_PREFIX
          script: |
            set -eu

            cd "${DO_APP_DIR:-/opt/medibot/backend}"

            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_USERNAME:-${USER}}" --password-stdin
            fi

            export IMAGE_TAG
            export MEDIBOT_BACKEND_IMAGE

            ./scripts/sync-r2-libs.sh

            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d medibot-db medibot-redis
            docker compose -f docker-compose.yml run --rm \
              -e RUN_DB_MIGRATIONS=true \
              -e RUN_COLLECTSTATIC=true \
              medibot-web ./docker-entrypoint.sh true
            docker compose -f docker-compose.yml up -d --remove-orphans
            docker compose -f docker-compose.yml ps

            # Wait for app to be ready with retry logic
            echo "Waiting for app to be ready at ${PRODUCTION_URL}..."
            echo "Initial startup delay: 10 seconds..."
            sleep 10

            for i in {1..30}; do
              if curl -fsS "${PRODUCTION_URL}/swagger.json" >/dev/null 2>&1; then
                echo "Smoke test passed! App is ready."
                exit 0
              fi
              echo "Attempt $i/30: Waiting 5s for app to be ready..."
              sleep 5
            done

            echo "App failed to respond after startup + 150 seconds"
            docker compose -f docker-compose.yml logs medibot-web | tail -50
            exit 1
