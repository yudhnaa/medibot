minimum_pre_commit_version: 4.0.0
default_stages: [pre-commit]

exclude: |
  (?x)^(
    .*\/migrations\/.*|
    \.venv\/.*|
    venv\/.*|
    env\/.*
  )$

repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: python -m black
        language: system
        types_or: [python, pyi]

      - id: isort
        name: isort
        entry: python -m isort
        args: ["--filter-files"]
        language: system
        types_or: [python, pyi]

      - id: flake8
        name: flake8
        entry: python -m flake8
        language: system
        types_or: [python, pyi]
