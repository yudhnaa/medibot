[tool.ruff]
extend-exclude = ["django_template/settings"]

# =============================================================================
# BLACK - Code Formatter
# =============================================================================
[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | migrations
)/
'''

# =============================================================================
# ISORT - Import Sorter
# =============================================================================
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [".venv", "migrations", "venv"]
skip_glob = ["**/migrations/*"]
known_django = ["django"]
known_drf = ["rest_framework"]
known_first_party = ["chatbot", "nlp", "vector_store", "core", "users"]
sections = ["FUTURE", "STDLIB", "DJANGO", "DRF", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

# =============================================================================
# FLAKE8 - Linter (via flake8-pyproject)
# =============================================================================
[tool.flake8]
max-line-length = 88
extend-ignore = [
    "E203",  # Whitespace before ':' (conflicts with black)
    "E501",  # Line too long (handled by black)
    "W503",  # Line break before binary operator (conflicts with black)
    "E231",  # Missing whitespace after ',' (conflicts with black in some cases)
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "migrations",
    "settings",
    "build",
    "dist",
    "*.egg-info",
    "__init__.py",
]
per-file-ignores = [
    "__init__.py:F401",  # Allow unused imports in __init__.py
    "settings/*.py:F401,F403,F405",  # Allow star imports in settings
]
max-complexity = 10

# =============================================================================
# MYPY - Type Checker
# =============================================================================
[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
pretty = true
plugins = ["mypy_django_plugin.main"]
exclude = [
    "migrations/",
    "tests/",
    ".venv/",
    "venv/",
]

[[tool.mypy.overrides]]
module = [
    "django.*",
    "rest_framework.*",
    "celery.*",
    "channels.*",
    "corsheaders.*",
    "google.*",
    "langchain.*",
    "chromadb.*",
    "pgvector.*",
    "transformers.*",
    "torch.*",
    "sentence_transformers.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "django_template.settings.base"

# =============================================================================
# PYLINT - Linter
# =============================================================================
[tool.pylint.master]
load-plugins = [
    "pylint_django",
]
django-settings-module = "django_template.settings.base"
ignore = [
    "migrations",
    ".venv",
    "venv",
    "manage.py",
]
ignore-paths = [
    "django_template/settings/",
    ".*migrations.*",
    "nlp/services/libs/",
]
ignore-patterns = [
    "test_.*\\.py",
    "[0-9]+.*\\.py",  # Migration files
]

[tool.pylint.messages_control]
disable = [
    "missing-docstring",
    "too-few-public-methods",
    "no-member",  # Django ORM dynamic attributes
    "duplicate-code",
    "fixme",
    "line-too-long",  # Handled by black
    "import-error",  # Handled by mypy
    "no-name-in-module",  # Handled by mypy
    "too-many-arguments",  # Allow more args for complex functions
    "too-many-positional-arguments",  # Allow more positional args
    "too-many-locals",  # Allow more local variables
    "no-else-return",  # Allow elif after return for readability
    "import-outside-toplevel",  # Allow conditional imports
    "invalid-name",  # Allow non-standard naming in specific cases
    "imported-auth-user",  # Django User model import is acceptable
    "wildcard-import",  # Needed for Django settings
    "unused-wildcard-import",  # Settings inherit from base
    "unused-import",  # Sometimes needed for side effects
    "invalid-envvar-default",  # Allow typed env defaults
]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
max-args = 7
max-locals = 15
max-returns = 6
max-branches = 12
max-statements = 50
max-parents = 7
max-attributes = 10
min-public-methods = 1

[tool.pylint.similarities]
min-similarity-lines = 6
ignore-imports = true

# =============================================================================
# AUTOFLAKE - Remove Unused Imports
# =============================================================================
[tool.autoflake]
recursive = true
in-place = true
remove-all-unused-imports = true
remove-unused-variables = true
ignore-init-module-imports = true
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "migrations",
]

# =============================================================================
# BANDIT - Security Linter
# =============================================================================
[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
    "migrations",
]
skips = [
    "B101",  # assert_used - Acceptable in tests
    "B104",  # hardcoded_bind_all_interfaces - Django dev server
    "B311",  # random - Not for cryptographic purposes
]
