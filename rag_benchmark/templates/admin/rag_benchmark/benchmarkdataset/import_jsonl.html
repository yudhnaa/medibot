{% extends "admin/base_site.html" %}

{% block content %}
  <div id="content-main">
    <h1>{{ title }}</h1>
    <p>Upload benchmark dataset in JSONL format. Each line must be one benchmark case object.</p>
    <form method="post" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <div class="submit-row">
        <input type="submit" value="Import" class="default" />
        <a href="{% url 'admin:rag_benchmark_benchmarkdataset_changelist' %}" class="button cancel-link">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
